services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ancora
      POSTGRES_USER: ancora
      POSTGRES_PASSWORD: ancora_dev
    ports:
      - "5432:5432"
    volumes:
      - ancora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ancora -d ancora"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  ancora_pgdata:
